name: Lighthouse CI

on:
  workflow_run:
    workflows: ["Deploy to Azure Static Web Apps"]
    types: [completed]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse
        run: |
          lhci autorun --collect.url="https://avarthusdevcloud.cloud" \
            --assert.preset="lighthouse:recommended" \
            --assert.assertions.categories:performance="error" \
            --assert.assertions.categories:accessibility="error" \
            --assert.assertions.categories:best-practices="error" \
            --assert.assertions.categories:seo="error"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
